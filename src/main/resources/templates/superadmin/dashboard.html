<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Super Admin Dashboard')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar('dashboard')}"></header>
<main class="page-shell">
    <section class="page-header">
        <div>
            <span class="eyebrow">Super Admin</span>
            <h1>Platform overview</h1>
        </div>
    </section>

    <section class="stats-grid">
        <article class="stat-card">
            <span>Total hospitals</span>
            <strong th:text="${hospitalCount}">0</strong>
        </article>
        <article class="stat-card">
            <span>Hospital admins</span>
            <strong th:text="${hospitalAdminCount}">0</strong>
        </article>
    </section>

    <section class="card action-grid">
        <a class="action-card" th:href="@{/super-admin/hospitals}">
            <h2>Hospitals</h2>
            <p>Review hospital enrolments, approve access, and manage active tenants.</p>
        </a>
        <a class="action-card" th:href="@{/super-admin/admins}">
            <h2>Hospital admins</h2>
            <p>Manage administrator accounts for approved hospitals.</p>
        </a>
    </section>
</main>
</body>
</html>
