services:
  postgres:
    image: postgres:17
    container_name: hospital-referrals-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hospital_referrals}
      POSTGRES_USER: ${POSTGRES_USER:-referrals}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-referrals}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hospital-referrals-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-hospital_referrals}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-referrals}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-referrals}
      APP_BOOTSTRAP_SUPER_ADMIN_EMAIL: ${APP_BOOTSTRAP_SUPER_ADMIN_EMAIL:-superadmin@referrals.local}
      APP_BOOTSTRAP_SUPER_ADMIN_PASSWORD: ${APP_BOOTSTRAP_SUPER_ADMIN_PASSWORD:-ChangeMe123!}
      APP_STORAGE_ATTACHMENTS_DIR: ${APP_STORAGE_ATTACHMENTS_DIR:-/app/storage/referral-attachments}
      SERVER_PORT: 8080
    ports:
      - "${APP_HOST_PORT:-8080}:8080"
    volumes:
      - referral-attachments:/app/storage/referral-attachments

volumes:
  postgres-data:
  referral-attachments:
